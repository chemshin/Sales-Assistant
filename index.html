<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0B1F3A" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>영지씨 · 영업지원시스템</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{
    --ink:#0B1F3A; --bg:#F5F6F8; --surface:#FFFFFF; --line:#E4E7EC;
    --muted:#5A6678; --faint:#8A94A6; --gold:#B8862B; --gold-soft:#F3E9D2;
    --ok:#1F9D6B; --busy:#D98A2B; --tight:#D14545;
    --ok-soft:#E4F4ED; --busy-soft:#FBEEDB; --tight-soft:#FBE3E3;
    --paid:#0B1F3A; --svc:#B9C2CE; --own:#B8862B;
    --shadow:0 1px 2px rgba(11,31,58,.06), 0 8px 24px rgba(11,31,58,.06);
    --radius:14px; --maxw:440px; --pad:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input{font-family:inherit;}
  a{text-decoration:none;color:inherit;}

  .app-frame{max-width:var(--maxw);margin:0 auto;min-height:100dvh;background:var(--bg);
    position:relative;box-shadow:0 0 60px rgba(11,31,58,.08);}
  .app{display:flex;flex-direction:column;min-height:100dvh;}

  /* ---------- TOP BAR ---------- */
  .topbar{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;
    padding:calc(env(safe-area-inset-top) + 15px) var(--pad) 15px;
    display:flex;align-items:center;justify-content:space-between;}
  .tb-title{font-weight:800;font-size:16.5px;letter-spacing:-.03em;}
  .tb-sub{font-size:11.5px;color:#9fb0c8;margin-top:1px;}

  .scroll{flex:1;padding:18px var(--pad) 96px;}
  .view{display:none;}
  .view.active{display:block;animation:fade .22s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:none;}}

  .view-head{margin:2px 0 15px;}
  .view-head h2{font-size:21px;font-weight:800;letter-spacing:-.03em;margin:0;}
  .view-head .vsub{color:var(--muted);font-size:12.5px;margin-top:3px;}

  .src{display:inline-block;font-size:10px;font-weight:800;padding:2px 7px;border-radius:99px;margin-left:5px;vertical-align:1px;}
  .src.live{background:var(--ok-soft);color:var(--ok);}
  .src.demo{background:var(--busy-soft);color:var(--busy);}

  /* ---------- TABS ---------- */
  .tabrow{display:flex;gap:6px;margin:0 0 10px;}
  .tab{flex:1 1 0;min-width:0;padding:9px 4px;border-radius:10px;font-size:13px;font-weight:800;
    letter-spacing:-.02em;background:var(--surface);border:1px solid var(--line);color:var(--muted);
    transition:all .14s;white-space:nowrap;text-align:center;}
  .tab.on{background:var(--ink);color:#fff;border-color:var(--ink);}
  .tabrow.date{margin-bottom:16px;overflow-x:auto;scrollbar-width:none;}
  .tabrow.date::-webkit-scrollbar{display:none;}
  .tab.sm{flex:0 0 auto;padding:7px 13px;font-size:12.5px;border-radius:9px;}
  .tab.sm.on{background:var(--gold);color:var(--ink);border-color:var(--gold);}
  .tab-empty{font-size:12px;color:var(--faint);padding:7px 2px;}
  .tab.sm.far{opacity:.5;}                                       /* 아직 안 받은 날 (누르면 로드) */
  .tab.sm.loading{opacity:.75;}
  .tab.sm.carried{border-style:dashed;color:var(--faint);}      /* 파일 없는 날 = 전날 편성 유지 */
  .tab.sm.carried.on{background:#D8C08A;border-style:dashed;border-color:var(--gold);color:var(--ink);}
  .carry{display:inline-block;font-size:10px;font-weight:800;margin-left:6px;
    background:var(--gold-soft);color:#6b531c;border:1px dashed #D8C08A;border-radius:99px;padding:2px 8px;}
  .carry.sm{margin-left:0;padding:1px 6px;font-size:9.5px;}

  /* ---------- SUMMARY ---------- */
  .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px;}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:13px 12px;box-shadow:var(--shadow);}
  .stat .num{font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1;}
  .stat .num small{font-size:13px;font-weight:700;color:var(--faint);margin-left:1px;}
  .stat .lab{font-size:11px;color:var(--muted);margin-top:6px;font-weight:500;}

  /* ---------- TABLE (엑셀 '▷ 편성표' 블록 재현) ---------- */
  .tbl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);overflow-x:auto;}
  .tbl{width:100%;border-collapse:collapse;}
  .tbl thead th{font-size:10.5px;font-weight:800;color:var(--faint);text-align:left;padding:10px 8px;
    background:#FAFBFC;border-bottom:1px solid var(--line);white-space:nowrap;}
  .tbl th.th-no{text-align:center;padding-left:12px;width:44px;}
  .tbl th.th-num,.tbl th.th-date{text-align:right;}
  .tbl th.th-cat{text-align:center;}
  .tbl th.th-note{padding-right:14px;}
  .tbl tbody tr{border-bottom:1px solid #F2F4F6;cursor:pointer;transition:background .12s;}
  .tbl tbody tr:last-child{border-bottom:none;}
  .tbl tbody tr:hover{background:#F7F9FB;}
  .tbl tbody tr.r-svc{background:#FDF6F1;}          /* 공익·건물주 = 원본의 연주황 행 */
  .tbl tbody tr.r-svc:hover{background:#FBF0E8;}
  .tbl td{padding:11px 8px;vertical-align:middle;}
  .td-no{text-align:center;padding-left:12px !important;font-size:11.5px;font-weight:700;
    color:var(--faint);font-variant-numeric:tabular-nums;}
  .td-adv{min-width:150px;}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px;}
  .dot.lg{width:9px;height:9px;margin-right:8px;vertical-align:2px;}
  .adv-name{font-size:13px;font-weight:700;letter-spacing:-.02em;}
  .new-tag{font-size:9px;font-weight:800;color:#fff;background:var(--tight);
    padding:1px 5px;border-radius:4px;margin-left:5px;vertical-align:1px;}
  .adv-sub{display:block;font-size:10.5px;color:var(--faint);margin:3px 0 0 14px;}
  .td-num{text-align:right;font-size:12.5px;font-weight:700;color:var(--muted);
    white-space:nowrap;font-variant-numeric:tabular-nums;}
  .td-date{text-align:right;font-size:11.5px;color:var(--muted);white-space:nowrap;
    font-variant-numeric:tabular-nums;}
  .td-cat{text-align:center;}
  .cat-pill{font-size:11px;font-weight:800;white-space:nowrap;}
  .td-note{font-size:11px;color:var(--faint);padding-right:14px !important;max-width:120px;}
  .sync{font-size:9.5px;font-weight:800;color:var(--gold);}
  .d-soon{display:inline-block;font-size:10.5px;font-weight:800;color:var(--tight);
    background:var(--tight-soft);padding:3px 7px;border-radius:6px;white-space:nowrap;}
  .d-far{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .d-gone{font-size:11px;color:var(--faint);}
  .tbl-foot{font-size:11.5px;color:var(--faint);text-align:center;margin-top:11px;}
  /* 타운보드 캠페인 리스트 */
  .town-grp td{background:#FAFBFC;padding:9px 12px !important;font-size:11px;font-weight:800;color:var(--muted);
    border-bottom:1px solid var(--line);}
  .tg-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px;}
  .tg-n{background:#fff;border:1px solid var(--line);border-radius:99px;padding:1px 7px;font-size:10px;color:var(--faint);margin-left:5px;}
  .adv-sub2{display:block;font-size:10.5px;color:var(--faint);margin-top:2px;}
  .td-prod{font-size:11.5px;color:var(--muted);white-space:nowrap;}
  .td-start,.td-end2{font-size:11.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;}
  .td-end2 .d-soon,.td-end2 .d-gone{margin-left:4px;}
  @media (max-width:520px){ .td-start,.td-end2{font-size:10.5px;} .adv-sub2{font-size:9.5px;} }

  /* 좁은 화면에서는 상세 컬럼을 접고, 광고주 줄 아래 요약(adv-sub)으로 대체 */
  .col-run,.col-date,.col-cat,.col-note{display:none;}
  @media (min-width:620px){
    .col-cat{display:table-cell;}
    .adv-sub{display:none;}
    .col-run{display:table-cell;}
  }
  @media (min-width:820px){
    .col-date{display:table-cell;}
  }
  @media (min-width:1000px){
    .col-note{display:table-cell;}
  }

  /* ---------- 매체현황: 도넛 카드 ---------- */
  .media-grid{display:grid;grid-template-columns:1fr;gap:11px;}
  .media-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;box-shadow:var(--shadow);cursor:pointer;transition:transform .1s,box-shadow .15s;position:relative;}
  .media-card:hover{box-shadow:0 4px 12px rgba(11,31,58,.10),0 12px 32px rgba(11,31,58,.08);}
  .media-card:active{transform:scale(.994);}
  .mc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
  .mc-name{font-size:16px;font-weight:800;letter-spacing:-.02em;}
  .mc-type{font-size:11.5px;color:var(--faint);margin-top:2px;}
  .badge{font-size:11px;font-weight:800;padding:4px 9px;border-radius:99px;white-space:nowrap;}
  .badge.ok{background:var(--ok-soft);color:var(--ok);}
  .badge.warn{background:var(--busy-soft);color:var(--busy);}
  .badge.danger{background:var(--tight-soft);color:var(--tight);}
  .mc-body{display:flex;align-items:center;gap:18px;}
  .donut{width:104px;height:104px;border-radius:50%;flex:0 0 auto;position:relative;
    display:flex;align-items:center;justify-content:center;}
  .donut::after{content:"";position:absolute;inset:13px;background:var(--surface);border-radius:50%;}
  .donut-center{position:relative;z-index:1;text-align:center;}
  .donut-pct{font-size:19px;font-weight:800;letter-spacing:-.04em;line-height:1;}
  .donut-lab{font-size:9.5px;color:var(--faint);margin-top:3px;font-weight:600;}
  .legend{flex:1;min-width:0;}
  .legend-item{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:12.5px;}
  .legend-item + .legend-item{border-top:1px solid #F2F4F6;}
  .legend-left{display:flex;align-items:center;gap:7px;color:var(--muted);}
  .legend-dot{width:9px;height:9px;border-radius:3px;flex:0 0 auto;}
  .legend-val{font-weight:800;font-variant-numeric:tabular-nums;}
  .click-hint{display:block;text-align:right;font-size:11px;color:var(--faint);margin-top:11px;font-weight:600;}

  /* ---------- 문서 카드 ---------- */
  .searchbar{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);
    border-radius:12px;padding:12px 14px;margin-bottom:14px;box-shadow:var(--shadow);}
  .searchbar input{flex:1;border:none;outline:none;font-size:14.5px;background:none;color:var(--ink);}
  .searchbar .ico{color:var(--faint);font-size:16px;}
  .doc-grid{display:grid;grid-template-columns:1fr;gap:10px;}
  .doc{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 15px;box-shadow:var(--shadow);display:flex;align-items:center;gap:13px;}
  .ficon{width:42px;height:42px;border-radius:10px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    font-size:10.5px;font-weight:800;color:#fff;}
  .ficon.pdf{background:#D14545;} .ficon.pptx,.ficon.ppt{background:#D98A2B;}
  .ficon.xlsx,.ficon.xls{background:#1F9D6B;} .ficon.other{background:#8A94A6;}
  .dmeta{flex:1;min-width:0;}
  .dname{font-size:13.5px;font-weight:700;letter-spacing:-.02em;line-height:1.35;}
  .dsub{font-size:11px;color:var(--faint);margin-top:3px;}
  .dacts{display:flex;gap:6px;flex:0 0 auto;}
  .dbtn{font-size:11.5px;font-weight:700;padding:7px 10px;border-radius:9px;border:1px solid var(--line);
    color:var(--muted);background:var(--surface);white-space:nowrap;transition:all .13s;}
  .dbtn:hover{border-color:var(--ink);color:var(--ink);}
  .dbtn.dl{background:var(--ink);color:#fff;border-color:var(--ink);}
  .dbtn.dl:hover{filter:brightness(1.12);color:#fff;}

  /* ---------- 게첨자료 ---------- */
  .filt-label{font-size:10.5px;font-weight:800;color:var(--faint);margin:0 0 6px;letter-spacing:.02em;}
  .chiprow{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 12px;padding:1px 16px 4px;scrollbar-width:none;}
  .chiprow::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;
    font-size:12.5px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;
    background:var(--surface);border:1px solid var(--line);color:var(--muted);transition:all .13s;}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink);}
  .chip .cn{font-size:10.5px;font-weight:800;opacity:.65;}
  .chip.on .cn{opacity:.8;}
  .idot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:0 0 auto;}
  .list-meta{font-size:12px;color:var(--faint);margin:0 0 10px;display:flex;
    justify-content:space-between;align-items:center;gap:10px;}
  .list-meta b{color:var(--ink);font-weight:800;}
  .seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:2px;}
  .seg-b{font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:7px;color:var(--muted);}
  .seg-b.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(11,31,58,.08);}
  .itag{font-size:9.5px;font-weight:800;border:1px solid;border-radius:5px;padding:2px 6px;background:#fff;}
  .mtag.dt{color:var(--faint);}
  .grp-head{font-size:11.5px;font-weight:800;color:var(--muted);margin:16px 0 8px;
    display:flex;align-items:center;gap:7px;}
  .grp-head .idot{margin-right:1px;}
  .grp-head:first-child{margin-top:0;}
  .grp-n{background:var(--bg);border:1px solid var(--line);border-radius:99px;
    padding:1px 7px;font-size:10.5px;color:var(--faint);}
  .asset{background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:13px 14px;margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer;
    display:flex;align-items:center;gap:10px;transition:border-color .13s;}
  .asset:hover{border-color:var(--ink);}
  .ameta{flex:1;min-width:0;}
  .aname{font-size:14px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:6px;}
  .sync-tag{font-size:9.5px;font-weight:800;color:var(--gold);background:var(--gold-soft);
    padding:2px 6px;border-radius:5px;}
  .atags{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap;align-items:center;}
  .mtag{font-size:10px;font-weight:800;color:var(--muted);background:var(--bg);
    border:1px solid var(--line);border-radius:5px;padding:2px 7px;}
  .asset .arrow{color:var(--faint);font-size:19px;flex:0 0 auto;}
  #assetFilter{margin-bottom:12px;}

  .notice{background:var(--gold-soft);border:1px solid #E8D7AE;border-radius:12px;
    padding:12px 14px;font-size:12.5px;color:#6b531c;line-height:1.6;margin-bottom:16px;}
  .notice b{font-weight:800;}
  .empty{text-align:center;padding:44px 20px;color:var(--faint);font-size:13px;}

  /* ---------- 로딩 오버레이 ---------- */
  .app.busy{filter:blur(7px) saturate(.7);pointer-events:none;user-select:none;}
  .loader{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;
    background:rgba(245,246,248,.55);transition:opacity .35s ease;}
  .loader.hide{opacity:0;pointer-events:none;}
  .loader-box{width:min(320px,80vw);text-align:center;background:var(--surface);
    border:1px solid var(--line);border-radius:18px;padding:26px 24px;
    box-shadow:0 8px 30px rgba(11,31,58,.14);}
  .loader-title{font-size:15px;font-weight:800;letter-spacing:-.03em;}
  .loader-sub{font-size:12.5px;color:var(--muted);margin:6px 0 16px;min-height:18px;}
  .bar{height:6px;border-radius:99px;background:#EAEDF1;overflow:hidden;}
  .bar > i{display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,var(--ink),var(--gold));transition:width .45s ease;}
  .loader-pct{font-size:11px;font-weight:800;color:var(--faint);margin-top:9px;font-variant-numeric:tabular-nums;}

  /* 뒤에서 채워지는 중임을 알리는 작은 표시 */
  .bg-load{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;
    color:var(--faint);background:var(--bg);border:1px solid var(--line);
    border-radius:99px;padding:4px 10px;margin-left:6px;}
  .bg-load .spin{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line);
    border-top-color:var(--gold);animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .skl{display:inline-block;height:12px;border-radius:5px;vertical-align:middle;
    background:linear-gradient(90deg,#EEF0F3 25%,#F6F7F9 37%,#EEF0F3 63%);
    background-size:400% 100%;animation:shim 1.2s ease infinite;}
  .skl.w20{width:20px}.skl.w30{width:28px}.skl.w40{width:40px}.skl.w50{width:52px}.skl.w60{width:64px}.skl.w70{width:78px}
  .skel-row td{padding-top:14px;padding-bottom:14px;}
  .skel{background:linear-gradient(90deg,#EEF0F3 25%,#F6F7F9 37%,#EEF0F3 63%);
    background-size:400% 100%;animation:shim 1.2s ease infinite;border-radius:10px;height:66px;margin-bottom:10px;}
  @keyframes shim{0%{background-position:100% 50%}100%{background-position:0 50%}}

  /* ---------- SHEET ---------- */
  .sheet-bg{position:fixed;inset:0;background:rgba(11,31,58,.45);z-index:60;opacity:0;pointer-events:none;
    transition:opacity .25s;backdrop-filter:blur(2px);}
  .sheet-bg.show{opacity:1;pointer-events:auto;}
  .sheet{position:absolute;left:0;right:0;bottom:0;max-width:var(--maxw);margin:0 auto;background:var(--surface);
    border-radius:22px 22px 0 0;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);
    max-height:88dvh;overflow-y:auto;padding:8px 20px calc(env(safe-area-inset-bottom) + 24px);}
  .sheet.show{transform:translateY(0);}
  .grab{width:40px;height:4px;border-radius:99px;background:var(--line);margin:8px auto 14px;}
  .sheet h3{font-size:19.5px;font-weight:800;letter-spacing:-.03em;margin:0;display:flex;align-items:center;}
  .sheet .s-type{color:var(--muted);font-size:12.5px;margin:4px 0 16px;}
  .spec-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  .spec{background:var(--bg);border-radius:11px;padding:12px 13px;}
  .spec .k{font-size:11px;color:var(--faint);font-weight:600;}
  .spec .v{font-size:14px;font-weight:700;margin-top:3px;letter-spacing:-.01em;}
  .spec.full{grid-column:1/-1;}
  .period{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:12px;padding:14px;margin-bottom:16px;}
  .p-side{flex:0 0 auto;} .p-side.r{text-align:right;}
  .p-k{font-size:10.5px;color:var(--faint);font-weight:700;}
  .p-v{font-size:13px;font-weight:800;letter-spacing:-.02em;margin-top:2px;white-space:nowrap;}
  .p-mid{flex:1;text-align:center;}
  .p-days{font-size:11px;font-weight:800;color:var(--muted);}
  .p-bar{height:3px;border-radius:99px;background:linear-gradient(90deg,var(--ink),var(--gold));margin:6px 0;}
  .p-left{font-size:10.5px;font-weight:800;color:var(--faint);}
  .p-left.soon{color:var(--tight);}
  .sheet-actions{display:flex;gap:9px;}
  .sa{flex:1;padding:14px;border-radius:12px;font-weight:700;font-size:14px;text-align:center;}
  .sa.primary{background:var(--ink);color:#fff;}
  .sa.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line);}
  .sect-label{font-size:12px;font-weight:800;color:var(--muted);margin:16px 0 9px;}
  .padv{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #F2F4F6;font-size:13px;}
  .padv:last-child{border-bottom:none;}
  .padv .pa-n{font-weight:700;letter-spacing:-.02em;}
  .pa-x{font-size:10px;font-weight:800;color:var(--faint);background:var(--bg);
    border:1px solid var(--line);border-radius:5px;padding:1px 5px;margin-left:6px;}
  .padv .pa-s{color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums;font-size:12.5px;}

  /* ---------- BOTTOM NAV ---------- */
  .nav{position:sticky;bottom:0;z-index:30;background:rgba(255,255,255,.93);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);display:flex;padding:8px 6px calc(env(safe-area-inset-bottom) + 8px);}
  .nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;color:var(--faint);transition:color .15s;}
  .nav button .ni{font-size:20px;line-height:1;}
  .nav button .nl{font-size:10.5px;font-weight:700;letter-spacing:-.02em;}
  .nav button.on{color:var(--ink);}

  /* ============ 반응형: 태블릿 ============ */
  @media (min-width:700px){
    :root{ --maxw:760px; --pad:24px; }
    .app-frame{box-shadow:none;}
    .media-grid{grid-template-columns:1fr 1fr;}
    .doc-grid{grid-template-columns:1fr 1fr;}
    .sheet{max-width:560px;border-radius:22px;bottom:auto;top:50%;transform:translate(0,-40%) scale(.97);
      opacity:0;left:50%;margin-left:-280px;max-height:82dvh;}
    .sheet.show{transform:translate(0,-50%) scale(1);opacity:1;}
    .grab{display:none;}
  }

  /* ============ 반응형: 데스크톱 ============ */
  @media (min-width:1000px){
    :root{ --maxw:1120px; --pad:32px; }
    body{background:#EEF0F3;}
    .app-frame{background:var(--bg);min-height:100vh;}
    .app{min-height:100vh;}

    /* 하단 탭바 → 상단 탭바 (헤더 아래에 붙임) */
    .topbar{order:-2;position:static;}          /* 헤더가 항상 맨 위 */
    .nav{order:-1;position:sticky;top:0;bottom:auto;border-top:none;border-bottom:1px solid var(--line);
      padding:0 var(--pad);gap:2px;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);}
    .nav button{flex:0 0 auto;flex-direction:row;gap:8px;padding:15px 20px;border-bottom:2px solid transparent;
      font-size:14px;}
    .nav button .ni{font-size:15px;}
    .nav button .nl{font-size:13.5px;}
    .nav button.on{border-bottom-color:var(--ink);}

    .topbar{padding:16px var(--pad);}
    .scroll{padding:28px var(--pad) 60px;max-width:1120px;margin:0 auto;width:100%;}
    .view-head h2{font-size:25px;}
    .summary{max-width:560px;}
    .media-grid{grid-template-columns:repeat(3,1fr);}
    .doc-grid{grid-template-columns:repeat(2,1fr);}
    .asset-list{column-count:2;column-gap:12px;}
    .asset,.grp-head{break-inside:avoid;}
    .tabrow{max-width:640px;}
    .tbl thead th,.tbl td{padding:13px 12px;}
    .adv-name{font-size:13.5px;}
    .tbl-wrap{max-width:100%;}
  }
  @media (min-width:1360px){
    :root{ --maxw:1280px; }
    .doc-grid{grid-template-columns:repeat(3,1fr);}
  }
</style>

        </div>

/* 폴더명 파싱: 260601_하루틴_CPMT_AP_T204 → 날짜/광고주/매체 */
const MEDIA_TOKENS = { 'CPMT':['CMT','PMT'], 'CMT':['CMT'], 'PMT':['PMT'],
  'AP':['AP'], 'T204':['T204'], '홍대':['CW'], '홍대 SYNC':['CW'] };
const MEDIA_ORDER = ['CMT','PMT','AP','CW','T204'];
function parseAsset(name){
  const t = String(name).split('_');
  let date = null;
  const m = (t[0]||'').match(/^(\d{2})(\d{2})(\d{2})$/);
  if(m){ date = '20'+m[1]+'-'+m[2]+'-'+m[3]; t.shift(); }
  const media = [];
  while(t.length > 1){
    const last = t[t.length-1].trim();
    const key = Object.keys(MEDIA_TOKENS).find(k=>k.toUpperCase()===last.toUpperCase());
    if(!key) break;
    MEDIA_TOKENS[key].forEach(x=>{ if(!media.includes(x)) media.push(x); });
    t.pop();
  }
  media.sort((a,b)=>MEDIA_ORDER.indexOf(a)-MEDIA_ORDER.indexOf(b));
  return { date, adv: t.join('_').trim() || name, media, sync: /SYNC/i.test(name) };
}

let industryMap = {};   /* '업종매핑' 탭에서 온 수동 지정 (광고주 → 업종) */

function classifyIndustry(adv){
  const s = String(adv||'');
  if(industryMap[s]) return industryMap[s];
  const up = s.toUpperCase();
  for(const [ind, kws] of INDUSTRY_RULES){
    if(kws.some(k=>up.includes(k.toUpperCase()))) return ind;
  }
  return '미분류';
}
const INDUSTRY_COLOR = {
  '공공·공익':'#7A8699', '자사 콘텐트':'#8A94A6', '미디어·엔터':'#7C5CBF',

};

/* ---------- 유틸 ---------- */
const fmtD    = s => { const d=new Date(s); return `${d.getMonth()+1}/${d.getDate()}`; };
const fmtFull = s => { const d=new Date(s); return `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}`; };
const today0  = () => { const t=new Date(); t.setHours(0,0,0,0); return t; };
const esc     = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mb      = n => n >= 1048576 ? (n/1048576).toFixed(1)+'MB' : Math.max(1,Math.round(n/1024))+'KB';
const r2      = n => Math.round(n*100)/100;

/* ---------- 날짜 해석 ----------
   편성표 파일이 없는 날은 "전날과 변동 없음"을 뜻합니다.
   따라서 날짜 탭은 전체 매체의 날짜를 합집합으로 만들고,
   해당 매체에 그 날짜가 없으면 직전 편성을 그대로 이어서 보여줍니다. */

/** 전체 매체를 통틀어 존재하는 날짜 (최신순) */
function allDates(){
  return [...new Set(sched.map(b=>b.d))].sort().reverse();
}
/** 해당 매체에 존재하는 날짜 (최신순) */
function datesOf(vid){
  return [...new Set(sched.filter(b=>b.v===vid).map(b=>b.d))].sort().reverse();
}
/** vid 기준으로 date 이하에서 가장 가까운 실제 편성일. 없으면 null */
function resolveDate(vid, date){
  const ds = datesOf(vid);                 // 최신순
  for(const d of ds){ if(d <= date) return d; }
  return null;
}
/** 선택한 날짜에 보여줄 편성 행 + 실제 기준일 + 이월 여부 */
function rowsFor(vid, date){
  const eff = date ? resolveDate(vid, date) : (datesOf(vid)[0] || null);
  if(!eff) return { rows:[], eff:null, carried:false };
  return { rows: sched.filter(b=>b.v===vid && b.d===eff), eff, carried: !!date && eff !== date };
}
function latestDate(vid){ return datesOf(vid)[0] || null; }

/** 구좌 집계: 유가(상업) / 서비스(공익+건물주) */
function slotStats(vid, date){
  const it = rowsFor(vid, date).rows;
  const paid = r2(it.filter(b=>b.c==='상업').reduce((s,b)=>s+b.s,0));
  const svc  = r2(it.filter(b=>b.c!=='상업').reduce((s,b)=>s+b.s,0));
  const total = r2(paid+svc);
  return { items:it, paid, svc, total, pct: total ? Math.round(paid/total*100) : 0 };
}

}

const TOWN_TYPES = ['광고','바로광고','서비스','중앙콘텐트'];

/** 타운보드 날짜 정규화: Date/문자열 다양한 형식 → 'YYYY-MM-DD' (실패 시 원문 유지) */
function tbDate(v){
  if(!v) return '';
  const s = String(v).trim();
  if(!s || s==='-') return '';
  let m = s.match(/^(\d{4})[-.\/\s]+(\d{1,2})[-.\/\s]+(\d{1,2})/);   // 2026-1-1, 2026. 1. 1
  if(m) return `${m[1]}-${String(+m[2]).padStart(2,'0')}-${String(+m[3]).padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);                       // M/D/YYYY
  if(m) return `${m[3]}-${String(+m[1]).padStart(2,'0')}-${String(+m[2]).padStart(2,'0')}`;
  // ISO 타임스탬프(2026-07-06T00:00:00...)
  m = s.match(/^(\d{4}-\d{2}-\d{2})T/);
  if(m) return m[1];
  return s;   // 알 수 없는 형식은 원문 그대로 노출
}
const TOWN_TYPE_COLOR = { '광고':'var(--paid)', '바로광고':'#2A7F7F', '서비스':'var(--own)', '중앙콘텐트':'#7C5CBF' };

/** 타운보드S/L — 캠페인 리스트 (일별 편성표와 구조가 다름) */
function renderTownboard(v){
  // 매체/날짜 탭 영역은 재사용, 날짜 탭 자리에 유형 필터를 넣습니다
  document.getElementById('schedChips').innerHTML = venues.map(x=>
    `<button class="tab${x.id===schedVenue?' on':''}" onclick="pickSchedVenue('${x.id}')">${x.short}</button>`).join('');

  const tag = dataSource==='live' ? '<span class="src live">실데이터</span>' : '<span class="src demo">예시 데이터</span>';

  if(dataSource!=='live'){
    document.getElementById('dateChips').innerHTML = '';
    document.getElementById('schedStats').innerHTML = '';
    document.getElementById('schedMeta').innerHTML = `${v.name} · ${v.loc} ${tag}`;
    document.getElementById('advBody').innerHTML = '';
    setTableHeadTown(false);
    document.querySelector('#v-sched .tbl-wrap').innerHTML =
      '<div class="empty">타운보드 캠페인은 실데이터 연결 시 표시됩니다.</div>';
    return;
  }

  if(!townboard && !townLoading){ loadTownboard(); }

  // 유형 필터 칩 (날짜 탭 자리)
  document.getElementById('dateChips').innerHTML =
    ['ALL'].concat(TOWN_TYPES).map(t=>`<button class="tab sm${t===townType?' on':''}" onclick="pickTownType('${t}')">${t==='ALL'?'전체':t}</button>`).join('')
    + `<span class="seg" style="margin-left:8px">
        <button class="seg-b${townScope==='live'?' on':''}" onclick="setTownScope('live')">운행중</button>
        <button class="seg-b${townScope==='all'?' on':''}" onclick="setTownScope('all')">전체</button>
      </span>`;

  if(townLoading || !townboard){
    document.getElementById('schedStats').innerHTML = '';
    document.getElementById('schedMeta').innerHTML = `${v.name} · ${v.loc} <span class="bg-load"><span class="spin"></span>캠페인 불러오는 중</span>`;
    restoreTableWrap();
    document.getElementById('advBody').innerHTML = '';
    setTableHeadTown(true);
    document.getElementById('advBody').innerHTML = '<tr><td colspan="5"><div class="skel" style="margin:8px 0"></div></td></tr>';
    return;
  }
  if(townboard.error){
    document.getElementById('schedMeta').innerHTML = `${v.name} ${tag}`;
    restoreTableWrap();
    document.querySelector('#v-sched .tbl-wrap').innerHTML = `<div class="empty">${esc(townboard.error)}</div>`;
    return;
  }

  const data = townboard[v.id] || { campaigns:[], content:[] };
  let all = (data.campaigns||[]).concat(data.content||[]);

  // 운행중 필터 (오늘이 시작~종료 사이)
  const today = serverToday || new Date().toISOString().slice(0,10);
  if(townScope==='live') all = all.filter(c=>{
    const s = tbDate(c.start), e = tbDate(c.end);
    const sOk = !/^\d{4}-\d{2}-\d{2}$/.test(s) || s<=today;
    const eOk = !/^\d{4}-\d{2}-\d{2}$/.test(e) || e>=today;
    return sOk && eOk;
  });
  if(townType!=='ALL') all = all.filter(c=>c.type===townType);

  // 통계
  const liveCount = all.length;
  const slotSum = r2(all.reduce((s,c)=>s+(c.slots||0),0));
  const advCount = new Set(all.map(c=>c.advertiser)).size;
  document.getElementById('schedStats').innerHTML = `
    <div class="stat"><div class="num">${liveCount}</div><div class="lab">캠페인</div></div>
    <div class="stat"><div class="num">${advCount}</div><div class="lab">광고주</div></div>
    <div class="stat"><div class="num">${slotSum}</div><div class="lab">운행 구좌</div></div>`;

  const scopeTxt = townScope==='live' ? `${fmtFull(today)} 운행중` : '전체';
  document.getElementById('schedMeta').innerHTML = `${v.name} · ${v.loc} · ${scopeTxt} ${tag}`;

  // 유형별 그룹 렌더
  restoreTableWrap();
  setTableHeadTown(true);
  const order = { '광고':0, '바로광고':1, '서비스':2, '중앙콘텐트':3 };
  const groups = {};
  all.forEach(c=>{ (groups[c.type] = groups[c.type]||[]).push(c); });
  const types = Object.keys(groups).sort((a,b)=>(order[a]??9)-(order[b]??9));

  if(!all.length){
    document.getElementById('advBody').innerHTML = '<tr><td colspan="5"><div class="empty">해당 조건의 캠페인이 없습니다.</div></td></tr>';
    return;
  }

  const t0 = serverToday ? new Date(serverToday) : today0();
  document.getElementById('advBody').innerHTML = types.map(type=>{
    const rows = groups[type].sort((a,b)=> (b.slots-a.slots) || a.advertiser.localeCompare(b.advertiser));
    const head = `<tr class="town-grp"><td colspan="5">
      <span class="tg-dot" style="background:${TOWN_TYPE_COLOR[type]||'var(--ink)'}"></span>${type} <span class="tg-n">${rows.length}</span></td></tr>`;
    const body = rows.map(c=>{
      const sD = tbDate(c.start), eD = tbDate(c.end);
      const eIso = /^\d{4}-\d{2}-\d{2}$/.test(eD) ? eD : null;
      const left = eIso ? Math.round((new Date(eIso)-t0)/864e5) : null;
      const endBadge = left==null ? ''
        : left<0 ? '<span class="d-gone">종료</span>'
        : left<=14 ? `<span class="d-soon">${left===0?'오늘':'D-'+left}</span>` : '';
      return `<tr>
        <td class="td-adv"><span class="adv-name">${esc(c.advertiser)}</span>
          <span class="adv-sub2">${esc(c.industry||'')}${c.product?' · '+esc(c.product):''}</span></td>
        <td class="td-date td-start">${sD||'–'}</td>
        <td class="td-date td-end2">${eD||'상시'}${endBadge?' '+endBadge:''}</td>
        <td class="td-num">${c.slots||'–'}</td>
        <td class="td-note col-note">${esc(c.note||'')}</td></tr>`;
    }).join('');
    return head + body;
  }).join('');
}

/** tbl-wrap 이 empty 로 덮인 경우 원래 테이블 구조 복구 */
function restoreTableWrap(){
  const wrap = document.querySelector('#v-sched .tbl-wrap');
  if(wrap && !wrap.querySelector('table')){
    wrap.innerHTML = `<table class="tbl"><thead><tr></tr></thead><tbody id="advBody"></tbody></table>`;
  }

function renderSched(){
  const v = venues.find(x=>x.id===schedVenue) || venues[0];
  if(v.townboard){ renderTownboard(v); return; }
  const dates = allDates();                         // 이미 받아온 날짜(합집합)
  // 서버가 알려준 전체 날짜(knownDates)에 있으면, 아직 데이터를 안 받았어도 유지
  const validDates = knownDates.length ? knownDates : dates;
  if(!validDates.includes(schedDate)) schedDate = validDates[0] || dates[0] || null;

  document.getElementById('schedChips').innerHTML = venues.map(x=>
    `<button class="tab${x.id===schedVenue?' on':''}" onclick="pickSchedVenue('${x.id}')">${x.short}</button>`).join('');

  // 날짜 탭은 서버가 알려준 전체 날짜(knownDates)로 그립니다.
  //  · 아직 안 받은 날짜 = 흐리게, 누르면 그때 불러옴
  //  · 이 매체에 편성이 없는 날 = 점선(전날 편성 이월)
  const tabs = (knownDates.length ? knownDates : dates);
  document.getElementById('dateChips').innerHTML = tabs.length
    ? tabs.map(d=>{
        const loaded = loadedDates[d];
        const own = loaded && datesOf(v.id).includes(d);
        const cls = [ 'tab','sm',
          d===schedDate ? 'on' : '',
          !loaded ? 'far' : (own ? '' : 'carried'),
          (dateLoading && d===schedDate) ? 'loading' : '' ].filter(Boolean).join(' ');
        return `<button class="${cls}" onclick="pickSchedDate('${d}')">${fmtD(d)}${(dateLoading&&d===schedDate)?' …':''}</button>`;
      }).join('')
    : '<span class="tab-empty">편성 데이터 없음</span>';

  const R  = rowsFor(v.id, schedDate);
  const st = slotStats(v.id, schedDate);
  const loadingNow = dataSource==='live' && schedDate && !loadedDates[schedDate] && !!inflight[schedDate];

  document.getElementById('schedStats').innerHTML = loadingNow
    ? `<div class="stat"><div class="num">–</div><div class="lab">편성 광고주</div></div>
       <div class="stat"><div class="num">–</div><div class="lab">총 구좌</div></div>
       <div class="stat"><div class="num">–</div><div class="lab">유가 점유율</div></div>`
    : `<div class="stat"><div class="num">${st.items.length}</div><div class="lab">편성 광고주</div></div>
       <div class="stat"><div class="num">${st.total}</div><div class="lab">총 구좌</div></div>
       <div class="stat"><div class="num">${st.pct}<small>%</small></div><div class="lab">유가 점유율</div></div>`;

  renderConnNotice();

  const loadingMeta = loadingNow
    ? '<span class="bg-load"><span class="spin"></span>편성표 불러오는 중</span>' : '';
  const tag = dataSource==='live' ? '<span class="src live">실데이터</span>' : '<span class="src demo">예시 데이터</span>';
  const carry = R.carried
    ? `<span class="carry">${fmtD(R.eff)} 편성 유지 · 변동 없음</span>` : '';
  document.getElementById('schedMeta').innerHTML =
    `${v.name} · 운영 ${v.hours}${schedDate?' · '+fmtFull(schedDate)+' 기준':''} ${tag}${carry}${loadingMeta}`;

  restoreTableWrap();
  setTableHeadTown(false);
  // 이 날짜를 지금 서버에서 받아오는 중이면 표 자리에 로딩을 표시
  // (응답이 오면 loadedDates 에 기록되고, 이월이면 이월 데이터가 그려집니다)
  if(loadingNow){
    renderTableLoading();
  } else {
    renderTable(R.rows, schedDate);
  }
}

/** 실데이터 연결에 실패했을 때 원인과 조치를 화면에 보여줍니다. */
function renderConnNotice(){
  const box = document.getElementById('connNotice');
  if(!box) return;
  if(dataSource === 'live' && !loadErrors.top){ box.innerHTML = ''; return; }
  const why = loadErrors.top ? esc(loadErrors.top) : '서버에 연결하지 못했습니다.';
  const diag = APPS_SCRIPT_URL ? APPS_SCRIPT_URL + '?action=diag' : '';
  box.innerHTML = `<div class="notice">
    <b>예시 데이터를 표시하고 있습니다.</b><br>${why}<br>
    ${diag?`<a href="${diag}" target="_blank" rel="noopener" style="text-decoration:underline">진단 페이지 열기 (?action=diag)</a> · `:''}
    브라우저 개발자도구 콘솔에도 상세 원인이 찍힙니다.
  </div>`;
}

function renderTable(items, viewDate){
  const t = today0();
  const noKey = b => b.no==='SYNC' ? 9999 : (parseInt(b.no,10) || 9999);
  const rows = items.slice().sort((a,b)=> noKey(a)-noKey(b));   // 원본 No. 순서

  document.getElementById('advBody').innerHTML = rows.map(b=>{
    const gi = sched.indexOf(b);
    const left = Math.round((new Date(b.en) - t)/864e5);
    const endCell = left < 0 ? `<span class="d-gone">${fmtD(b.en)}</span>`
      : left <= 14 ? `<span class="d-soon">${b.en.slice(5).replace('-','/')} · ${left===0?'오늘':'D-'+left}</span>`
      : `<span class="d-far">${b.en}</span>`;
    const isNew = b.st === (viewDate || b.d);   // 선택한 날짜에 시작 = 신규 편성
                                               // (이월된 날짜에는 NEW 를 붙이지 않습니다)
    return `<tr class="${b.c==='상업'?'':'r-svc'}" onclick="openBooking(${gi})">

async function pickSchedVenue(id){
  schedVenue=id;
  const v = venues.find(x=>x.id===id);
  if(v && v.townboard){ renderSched(); loadTownboard(); return; }
  renderSched();
  await ensureAround(schedDate);
}
async function pickSchedDate(d){
  schedDate=d;
  // 아직 안 받은 날짜면 먼저 로딩 상태로 표시되도록 inflight 를 선점
  if(dataSource==='live' && !loadedDates[d]) inflight[d] = inflight[d] || Promise.resolve();
  renderSched();
  await ensureAround(d);
}
/** 선택일과 그 근처(이월 계산용 직전일 포함)를 확보 */
async function ensureAround(d){
  if(!d) return;
  await ensureDate(d);
  // 선택일 이하에서 아직 안 받은 날짜가 있으면, 이월 원본을 찾기 위해 하나 더 확보
  const idx = knownDates.indexOf(d);
  if(idx >= 0){
    for(let k=idx+1; k<knownDates.length; k++){
      if(!loadedDates[knownDates[k]]){ await ensureDate(knownDates[k]); break; }
      if(sched.some(b=>b.v===schedVenue && b.d===knownDates[k])) break;
    }
  }
}

function setMediaMode(mode){
  mediaMode = mode;
  document.getElementById('mmDay').classList[mode==='day'?'add':'remove']('on');
  document.getElementById('mmMonth').classList[mode==='month'?'add':'remove']('on');
  document.getElementById('monthChips').style.display = mode==='month' ? '' : 'none';

async function loadMonthly(){
  if(dataSource!=='live'){ renderMedia(); return; }
  monthlyLoading = true; renderMedia();
  try{
    const json = await api('monthly');
    monthly = json;
    if(Array.isArray(json.months) && json.months.length){
      // 기본 선택월: 이번 달(있으면), 없으면 마지막
      const now = (serverToday ? Number(serverToday.slice(5,7)) : (new Date().getMonth()+1)) + '월';
      monthSel = json.months.includes(now) ? now : json.months[json.months.length-1];
    }
  }catch(err){
    console.warn('월 재원 로드 실패', err);
    monthly = { months:[], venues:[], error: String(err && err.message || err) };
  }finally{
    monthlyLoading = false; renderMedia();
  }
}

function openVenue(vid){
  const v = venues.find(x=>x.id===vid);
  const gLatest = allDates()[0] || null;
  const R = rowsFor(vid, gLatest);
  const st = slotStats(vid, gLatest);
  // 패널에서는 같은 광고주를 합쳐 보여줍니다 (구좌 합계)
  const roll = list => {
    const m = {};
    list.forEach(b=>{ if(!m[b.a]) m[b.a]={a:b.a,s:0,r:b.r,n:0}; m[b.a].s+=b.s; m[b.a].n++; });
    return Object.values(m).map(x=>({...x,s:r2(x.s)})).sort((a,b)=>b.s-a.s || a.a.localeCompare(b.a));
  };
  const paid = roll(st.items.filter(b=>b.c==='상업'));
  const svc  = roll(st.items.filter(b=>b.c!=='상업'));
  const row = b => `<div class="padv"><span class="pa-n">${esc(b.a)}${b.n>1?`<span class="pa-x">×${b.n}</span>`:''}</span><span class="pa-s">${b.s?b.s+'구좌':'SYNC'} · ${b.r}s</span></div>`;
  showSheet(`
    <h3>${v.short} · ${v.name}</h3>
    <div class="s-type">${v.type} · ${v.loc} · ${R.eff?fmtFull(R.eff)+' 기준':''}${R.carried?' (이월)':''}</div>
    <div class="spec-grid">
      <div class="spec"><div class="k">유가 점유율</div><div class="v">${st.pct}%</div></div>
      <div class="spec"><div class="k">총 구좌</div><div class="v">${st.total}구좌</div></div>
      <div class="spec"><div class="k">유가</div><div class="v">${st.paid}구좌</div></div>
      <div class="spec"><div class="k">서비스</div><div class="v">${st.svc}구좌</div></div>
      <div class="spec full"><div class="k">운영</div><div class="v">${v.hours} · ${v.cycle}</div></div>
    </div>
    <div class="sect-label">유가 광고주 · ${paid.length}개</div>
    ${paid.map(row).join('') || '<div class="empty">없음</div>'}
    <div class="sect-label">서비스 (공익·건물주) · ${svc.length}개</div>
    ${svc.map(row).join('') || '<div class="empty">없음</div>'}
    <div class="sheet-actions" style="margin-top:18px">
      <button class="sa ghost" onclick="closeSheet()">닫기</button>
      <button class="sa primary" onclick="jumpSched('${vid}')">편성표 보기</button>
    </div>`);
}

  document.querySelector('.nav button[data-v="v-sched"]').click(); }

function fileCard(f){
  const ext = (f.ext||'other').toLowerCase();
  const cls = ['pdf','pptx','ppt','xlsx','xls'].includes(ext) ? ext : 'other';
  const view = f.view || `https://drive.google.com/file/d/${f.id}/view`;
  const dl   = f.download || `https://drive.google.com/uc?export=download&id=${f.id}`;
  return `<div class="doc">
    <div class="ficon ${cls}">${ext.toUpperCase().slice(0,4)}</div>
    <div class="dmeta">
      <div class="dname">${esc(f.name)}</div>
      <div class="dsub">${mb(f.size)}${f.updated?' · '+f.updated:''}</div>
    </div>
    <div class="dacts">
      <a class="dbtn" href="${view}" target="_blank" rel="noopener">보기</a>
      <a class="dbtn dl" href="${dl}" target="_blank" rel="noopener">받기</a>
    </div>
  </div>`;
}
function filterFiles(list, q){
  q = (q||'').trim().toLowerCase();
  return q ? list.filter(f=>f.name.toLowerCase().includes(q)) : list;
}
function renderDocs(){

let assetInd   = 'ALL';
let assetGroup = 'date';   // 'date' | 'industry'

function renderAssets(){
  const q = ((document.getElementById('assetSearch')||{}).value||'').trim().toLowerCase();
  const notice = document.getElementById('assetNotice');

  if(filesLoading && dataSource==='live'){
    notice.innerHTML = '';
    document.getElementById('assetGrid').innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div>';
    document.getElementById('assetCount').textContent = '불러오는 중…';
    return;
  }

  if(!assets.length){
    notice.innerHTML = `<div class="notice"><b>게첨자료를 불러오지 못했습니다.</b><br>
      ${loadErrors.assets ? esc(loadErrors.assets) : 'Config.gs 의 ASSET_FOLDER_ID 를 확인하세요.'}<br>
      <span style="opacity:.8">진단: Apps Script URL 뒤에 <b>?action=diag</b> 를 붙여 브라우저로 열어보세요.</span></div>`;
    document.getElementById('assetGrid').innerHTML = '<div class="empty">표시할 자료가 없습니다.</div>';
    return;
  }
  notice.innerHTML = loadErrors.assets
    ? `<div class="notice"><b>주의 ·</b> 실데이터 로드 실패로 예시 목록을 표시 중입니다. ${esc(loadErrors.assets)}</div>` : '';

  const parsed = assets.map(a=>{
    const p = parseAsset(a.name);
    return Object.assign({}, a, p, { ind: classifyIndustry(p.adv) });
  });

  // 매체 칩
  const bar = document.getElementById('assetFilter');
  bar.innerHTML = ['ALL'].concat(MEDIA_ORDER).map(mv=>{
    const n = mv==='ALL' ? parsed.length : parsed.filter(a=>a.media.includes(mv)).length;
    return `<button class="chip${mv===assetMedia?' on':''}" onclick="pickAssetMedia('${mv}')">${mv==='ALL'?'전체':mv}<span class="cn">${n}</span></button>`;
  }).join('');

  // 업종 칩 (건수 많은 순)
  const indCount = {};
  parsed.forEach(a=>{ indCount[a.ind] = (indCount[a.ind]||0)+1; });
  const inds = Object.keys(indCount).sort((a,b)=>indCount[b]-indCount[a]);
  const ibar = document.getElementById('industryFilter');
  ibar.innerHTML = `<button class="chip${assetInd==='ALL'?' on':''}" onclick="pickAssetInd('ALL')">전체<span class="cn">${parsed.length}</span></button>` +
    inds.map(i=>`<button class="chip${i===assetInd?' on':''}" onclick="pickAssetInd('${i}')">
      <span class="idot" style="background:${INDUSTRY_COLOR[i]||'#B9C2CE'}"></span>${i}<span class="cn">${indCount[i]}</span></button>`).join('');

  let list = parsed;
  if(assetMedia !== 'ALL') list = list.filter(a=>a.media.includes(assetMedia));
  if(assetInd   !== 'ALL') list = list.filter(a=>a.ind === assetInd);
  if(q) list = list.filter(a=>a.adv.toLowerCase().includes(q) || a.ind.toLowerCase().includes(q) || a.name.toLowerCase().includes(q));

  document.getElementById('assetCount').textContent = `${list.length}건`;

  if(!list.length){
    document.getElementById('assetGrid').innerHTML = '<div class="empty">조건에 맞는 자료가 없습니다.</div>';
    return;
  }

  // 그룹핑
  const groups = {};
  list.forEach(a=>{
    const k = assetGroup==='industry' ? a.ind : (a.date || '기타');
    (groups[k] = groups[k] || []).push(a);
  });
  const keys = assetGroup==='industry'
    ? Object.keys(groups).sort((a,b)=>groups[b].length-groups[a].length)
    : Object.keys(groups).sort().reverse();

  const card = a => `
    <div class="asset" onclick="openAsset('${a.id}')">
      <div class="ameta">
        <div class="aname">${esc(a.adv)}${a.sync?'<span class="sync-tag">SYNC</span>':''}</div>
        <div class="atags">
          <span class="itag" style="color:${INDUSTRY_COLOR[a.ind]||'#8A94A6'};border-color:currentColor">${a.ind}</span>
          ${a.media.map(m=>`<span class="mtag">${m}</span>`).join('')}
          ${assetGroup==='industry' && a.date ? `<span class="mtag dt">${fmtD(a.date)}</span>` : ''}
        </div>
      </div>
      <span class="arrow">›</span>
    </div>`;

  document.getElementById('assetGrid').innerHTML = keys.map(k=>{
    const head = assetGroup==='industry'
      ? `<span class="idot" style="background:${INDUSTRY_COLOR[k]||'#B9C2CE'}"></span>${k}`
      : (k==='기타' ? '날짜 미상' : fmtFull(k)+' 게첨');
    return `<div class="grp-head">${head} <span class="grp-n">${groups[k].length}</span></div>
      ${groups[k].map(card).join('')}`;
  }).join('');
}

/** 캠페인 폴더 클릭 → 그 안의 파일 목록을 불러와 다운로드 링크 표시 */
async function openAsset(id){
  const a = assets.find(x=>x.id===id);
  const p = parseAsset(a.name);
  const folderUrl = a.view || `https://drive.google.com/drive/folders/${id}`;
  const head = `
    <h3>${esc(p.adv)}</h3>
    <div class="s-type">${p.date?fmtFull(p.date)+' 게첨 · ':''}${p.media.join(' · ')}${p.sync?' · SYNC':''}
      · <span style="color:${INDUSTRY_COLOR[classifyIndustry(p.adv)]||'#8A94A6'};font-weight:700">${classifyIndustry(p.adv)}</span></div>`;

  showSheet(head + '<div class="empty">자료를 불러오는 중…</div>');

  let files = [], err0 = '';
  if(APPS_SCRIPT_URL){
    try{
      const res = await fetch(`${APPS_SCRIPT_URL}?action=assetFiles&id=${encodeURIComponent(id)}`);
      const json = await res.json();
      files = json.files || [];
      if(json.error) err0 = json.error;
    }catch(err){ err0 = String(err && err.message || err); }
  }

  const body = files.length
    ? `<div class="sect-label">파일 ${files.length}개</div>${files.map(fileCard).join('')}`
    : `<div class="notice">파일 목록을 불러오지 못했습니다.${err0?'<br>'+esc(err0):''}<br>아래 버튼으로 드라이브 폴더를 열어 확인하세요.</div>`;

  showSheet(head + body + `
    <div class="sheet-actions" style="margin-top:16px">
      <button class="sa ghost" onclick="closeSheet()">닫기</button>
      <a class="sa primary" href="${folderUrl}" target="_blank" rel="noopener">드라이브에서 열기</a>
    </div>`);
}

/* ============ 공통 ============ */
function showSheet(html){
  document.getElementById('sheetBody').innerHTML = html;
  document.getElementById('sheetBg').classList.add('show');
  document.getElementById('sheet').classList.add('show');
}
function closeSheet(){
  document.getElementById('sheetBg').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
}
function switchView(btn){
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById(btn.dataset.v).classList.add('active');
  window.scrollTo(0,0);
}

/* ============ 단계별 로딩 ============
   ① latest  : 최신 1일치 편성 → 이것만 오면 바로 화면을 엽니다
   ② history : 나머지 날짜 (뒤에서 조용히)
   ③ files   : 소개서·게첨자료 (드라이브라 느림, 뒤에서 조용히)      */

function setProgress(pct, msg){
  const bar = document.getElementById('bar');
  const pctEl = document.getElementById('loaderPct');
  const msgEl = document.getElementById('loaderMsg');
  if(bar) bar.style.width = pct + '%';
  if(pctEl) pctEl.textContent = Math.round(pct) + '%';
  if(msg && msgEl) msgEl.textContent = msg;
}
function revealApp(){
  setProgress(100, '완료');
  setTimeout(()=>{
    document.getElementById('loader').classList.add('hide');
    document.getElementById('app').classList.remove('busy');
  }, 220);
}

function api(action, extra){
  const q = APPS_SCRIPT_URL + '?action=' + action + (extra||'');
  return fetch(q).then(async res=>{
    if(!res.ok) throw new Error('HTTP ' + res.status + ' ' + res.statusText);
    const text = await res.text();
    let json;
    try { json = JSON.parse(text); }
    catch(e){
      throw new Error(/<html/i.test(text)
        ? '서버가 JSON 대신 HTML(로그인 페이지)을 반환했습니다. 배포 설정의 액세스 권한을 "모든 사용자"로 바꾸세요.'
        : 'JSON 파싱 실패: ' + text.slice(0,120));
    }
    if(json.error) throw new Error(json.error);
    return json;
  });
}

function toRow(b){
  return { d:b.date, v:String(b.venue), no:String(b.no||''), a:b.advertiser,
           r:Number(b.runtime)||0, s:Number(b.slots)||0, st:b.start, en:b.end,
           c:String(b.category||'상업').trim(), n:b.note||'' };
}

/** ① 최신 편성 — 이것만 성공하면 화면을 엽니다 */
async function loadLatest(){
  if(!APPS_SCRIPT_URL){ loadErrors.top = 'APPS_SCRIPT_URL 이 비어 있습니다.'; return false; }
  const json = await api('latest');
  if(!Array.isArray(json.bookings) || !json.bookings.length){
    loadErrors.top = "서버 응답은 정상인데 '편성표' 탭이 비어 있습니다. Apps Script 에서 rebuildAll → runIngest 를 실행하세요.";
    return false;
  }
  if(json.bookings[0].date === undefined){
    loadErrors.top = '서버가 date 컬럼을 내려주지 않습니다. Code.gs 가 옛 버전입니다 — 재배포(새 버전)가 필요합니다.';
    return false;
  }
  sched.length = 0;
  loadedDates = {};
  inflight = {};
  json.bookings.forEach(b=>{ sched.push(toRow(b)); loadedDates[b.date] = true; });
  if(Array.isArray(json.venues) && json.venues.length){
    venues.length = 0; json.venues.forEach(v=>venues.push(v));
  }
  knownDates = Array.isArray(json.dates) ? json.dates : [];
  serverToday = json.today || null;
  schedDate = json.latest || null;
  dataSource = 'live';
  return true;
}

/** 특정 날짜를 서버에서 받아 sched 에 추가합니다 (탭 클릭 시). 이미 있으면 건너뜀 */
let inflight = {};   // 같은 날짜 동시 요청 방지
async function ensureDate(date){
  if(!date || dataSource!=='live') return;
  if(loadedDates[date]) return;             // 이미 로드됨
  if(inflight[date]) return inflight[date];  // 로딩 중이면 그 약속을 재사용

  dateLoading = true; renderSched();
  inflight[date] = (async()=>{
    try{
      const json = await api('byDate', '&date=' + encodeURIComponent(date));
      // ★ 병합 전에 이 날짜의 기존 행을 먼저 제거 → 몇 번 불러도 중복 안 생김
      for(let i=sched.length-1; i>=0; i--){ if(sched[i].d === date) sched.splice(i,1); }
      if(Array.isArray(json.bookings)){
        json.bookings.forEach(b=>sched.push(toRow(b)));
      }
      loadedDates[date] = true;   // 0건이어도 '읽었음'으로 표시(재요청 방지)
    }catch(err){
      console.warn('날짜 로드 실패', date, err);
    }
  })();
  try { await inflight[date]; }
  finally { delete inflight[date]; dateLoading = false; renderSched(); renderMedia(); }
}

/** ③ 소개서·게첨자료 — 드라이브 조회라 느림 */
async function loadFiles(){
  const json = await api('files');
  if(Array.isArray(json.docs)   && json.docs.length){ docs.length = 0; json.docs.forEach(f=>docs.push(f)); }
  if(Array.isArray(json.assets) && json.assets.length){ assets = json.assets; }
  if(Array.isArray(json.industries)){
    industryMap = {};
    json.industries.forEach(r=>{ if(r.advertiser && r.industry) industryMap[r.advertiser] = r.industry; });
  }
  if(json.errors) loadErrors = Object.assign({}, loadErrors, json.errors);
}

/** 실패 시: 예시 데이터로 내려앉고 원인을 배너로 알립니다 */
function fallbackToDemo(err){
  const m = String(err && err.message || err || '');
  console.warn('데이터 로드 실패 — 예시 데이터로 표시합니다.', err);
  if(m) loadErrors.top = /Failed to fetch|NetworkError|CORS/i.test(m)
    ? m + ' — 배포 설정에서 액세스 권한이 "모든 사용자"인지, URL 이 /exec 로 끝나는지 확인하세요.'
    : m;
  dataSource = 'demo';
}

function renderAll(){ renderSched(); renderMedia(); renderDocs(); renderAssets(); }

(async function init(){
  document.getElementById('app').classList.add('busy');
  setProgress(12, '편성표를 불러오는 중…');

  // ① 최신 편성
  try {
    const ok = await loadLatest();
    if(!ok) fallbackToDemo(null);
  } catch(err){ fallbackToDemo(err); }

  setProgress(70, '화면을 준비하는 중…');
  renderAll();
  revealApp();

  // ② 기본 표시일 주변(이월 계산용) 확보
  if(dataSource === 'live'){ ensureAround(schedDate); }

  // ③ 드라이브 파일 (백그라운드)
  if(dataSource === 'live'){
    loadFiles()
      .catch(err=>{ loadErrors.assets = loadErrors.assets || String(err && err.message || err); })
      .finally(()=>{ filesLoading = false; renderDocs(); renderAssets(); });
  } else {
    filesLoading = false;
    renderDocs(); renderAssets();
  }
})();
</script>
</body>
